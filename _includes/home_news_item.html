<!-- One news row on the redesigned pages. Pass item=... and date_format=... (strftime). -->
{%- assign item = include.item %}
<li>
  <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: include.date_format }}</time>
  <div class="news-text">
    {%- if item.inline -%}
      {{ item.content | remove: '<p>' | remove: '</p>' | strip }}
    {%- else -%}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {%- endif -%}
  </div>
</li>
